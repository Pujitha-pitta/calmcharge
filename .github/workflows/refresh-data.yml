name: refresh data

# Day-ahead prices for tomorrow are published around 13:00 Swedish time.
# Refreshing shortly after keeps the live app's snapshot current; the push
# to main then redeploys the app on Vercel.
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m src.refresh_snapshot
      - name: Commit the updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          if git diff --cached --quiet; then
            echo "No new prices yet."
          else
            git commit -m "Refresh SE4 price snapshot"
            git push
          fi
